# gitleaks configuration. Extends the default ruleset and allowlists values that
# are intentional, non-secret placeholders (CI dummies, build args, example env).
#
# Enforced two ways: the pre-commit hook (scripts/pre-commit.mjs) runs
# `gitleaks protect --staged`, and CI runs `gitleaks detect` over the history.
[extend]
useDefault = true

[allowlist]
description = "CI/build placeholders and documented example env — not real credentials"
regexes = [
  # Dummy AUTH_SECRET used only by CI and local test runs (config requires >=16 chars).
  '''ci-secret-at-least-32-characters-long''',
  # Placeholder baked into the web Docker build stage; overridden at runtime.
  '''build-time-placeholder-secret-32chars''',
  # Dummy visitor-hash and auth secrets for the CI, integration and load lanes.
  # Each is a fixed, public test value; real ones come from .env (gitignored).
  '''ci-visitor-secret-32-characters-x''',
  '''integration-visitor-secret-0123''',
  '''integration-auth-secret-0123456789''',
  '''loadtest-visitor-secret-0123456''',
  '''seed-visitor-secret-not-a-real-one''',
]
paths = [
  # Documented, value-less example environment file.
  '''\.env\.example''',
]
