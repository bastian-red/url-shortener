<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · Short links</title>
<style>
/* Tokens copied from apps/web/app/globals.css. apps/web/lib/redirect-pages.test.ts
   fails if any value here drifts from the stylesheet, and the E2E axe run
   covers this page in both schemes. No web fonts: an error page should not
   send a visitor's address to a font host. */
:root {
  --bg: #dce8f7;
  --surface: #f4f8fd;
  --text: #0f2140;
  --muted: #4a5d78;
  --accent: #b50f2b;
  --border: #5f7290;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1a35;
    --surface: #112447;
    --text: #eaf1fb;
    --muted: #9fb2cc;
    --accent: #ff6b7d;
    --border: #6a809f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--text);
  font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  width: 100%; max-width: 520px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px; padding: 32px 28px;
}
.code {
  display: inline-flex; gap: 8px; align-items: center; margin: 0 0 16px;
  font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--muted); letter-spacing: .02em;
}
.glyph { font-size: 18px; color: var(--accent); }
h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; letter-spacing: -.01em; }
p { margin: 0 0 20px; color: var(--muted); }
.slug { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); overflow-wrap: anywhere; }
a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
<p class="code"><span class="glyph" aria-hidden="true">{{.Glyph}}</span><span>{{.Status}} · {{.Word}}</span></p>
<h1>{{.Title}}</h1>
<p>{{.Message}}{{if .Slug}} <span class="slug">/{{.Slug}}</span>{{end}}</p>
<a href="{{.Home}}">Make your own short link</a>
</main>
</body>
</html>
